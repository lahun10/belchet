idth:120px}.jt i{font-style:normal;color:var(--mut)}.pdfb{padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--cell);font-weight:700;font-size:13px}.seg{flex-wrap:wrap}.seg button{flex:1 1 30%}.dot{display:inline-block;width:24px;height:24px;border:0;border-radius:0;margin-right:6px;vertical-align:middle}.mtot{background:var(--cell)}.rl{display:block;color:var(--mut);font-size:11px;padding-left:8px}.gap{width:14px;min-width:14px;padding:0;background:var(--bg)}.ad th{white-space:normal;font-size:11px;min-width:54px}.ad th.gap{min-width:14px}.ad thead tr+tr th:first-child{position:static;min-width:54px;text-align:center;background:transparent}.c.W{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 60%,var(--card))}.c.G{border-color:#7bd39a;background:color-mix(in srgb,#9be7b3 60%,var(--card))}.pg th:first-child,.pg td:first-child{min-width:72px;font-weight:600}.pg .mt{min-width:170px}.app .seg{background:none;padding:0;gap:6px}.app .seg button{flex:0 0 auto;padding:8px 13px;font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:20px}.app .seg button.on{background:var(--acc);border-color:var(--acc);color:#14241d}.fs{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.fs div{display:flex;justify-content:space-between;gap:10px}.fs .big{font-size:18px;font-weight:800}.neg{color:var(--bad)}.pos{color:var(--ok)}.ft{min-width:112px}.adadmin-toggle{width:100%;font-weight:800}.adadmin-panel{display:grid;gap:10px;margin-top:10px}.dc{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;display:grid;gap:10px;margin-bottom:10px}.dh{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}.ph{width:58px;height:58px;border-radius:50%;background:var(--cell);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--mut);font-weight:800;font-size:20px;cursor:pointer}.ph img{width:100%;height: function createLocalDemoDB(){
 const KEY='belchet.demo.db';
 let store={};
 try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
 // Migra las cuentas de la versión de prueba anterior para que no tengas que registrarlas otra vez.
 try{const oldAccounts=JSON.parse(localStorage.getItem('belchet.demo.accounts')||'{}')||{};Object.keys(oldAccounts).forEach(u=>{const path='accounts/'+u;if(!store[path])store[path]=oldAccounts[u]})}catch(e){}
 try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
 const listeners={};
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
 const snapshot=name=>({docs:Object.keys(store).filter(k=>k.startsWith(name+'/')).map(k=>({id:k.slice(name.length+1),data:()=>store[k]}))});
 const notify=name=>(listeners[name]||[]).forEach(fn=>{try{fn(snapshot(name))}catch(e){}});
 return {
  doc(path){return {
   async get(){const exists=Object.prototype.hasOwnProperty.call(store,path);return {exists,data:()=>store[path]};},
   async set(value){store[path]=value;persist();notify(path.split('/')[0]);},
   async delete(){delete store[path];persist();notify(path.split('/')[0]);}
  }},
  collection(name){return {onSnapshot(fn){(listeners[name]||(listeners[name]=[])).push(fn);fn(snapshot(name));return ()=>{listeners[name]=listeners[name].filter(x=>x!==fn)}}}}
 };
}

const PRIVATE_FIELDS=['cum','foto','nac','venc','pad','tpad','mad','tmad','dir','med'];

async function migrateLegacyPrivateData(){
 // Solo una cuenta Scouter puede ejecutar esta migración. Las reglas ETAPA 1
 // deben estar publicadas antes de abrir la app con datos existentes.
 if(legacyMigrationStarted||!canEdit||!db)return;
 legacyMigrationStarted=true;
 try{
  const ids=Object.keys(people);
  let moved=0;
  for(const id of ids){
   const raw=people[id]||{};
   const priv={};
   PRIVATE_FIELDS.forEach(k=>{if(Object.prototype.hasOwnProperty.call(raw,k))priv[k]=raw[k]});
   const pub={...raw};
   PRIVATE_FIELDS.forEach(k=>delete pub[k]);
   // Primero guarda los datos privados; solo después elimina esos campos del documento público.
   if(Object.keys(priv).length){
    const ref=db.doc('privatePeople/'+id),old=await ref.get(),prior=old.exists?(old.data()||{}):{};
    await ref.set({...priv,...prior});
    moved++;
   }
   if(Object.keys(pub).some(k=>PRIVATE_FIELDS.includes(k)))throw new Error('No se pudo limpiar el documento público '+id);
   await db.doc('people/'+id).set(pub);
  }
  // Verificación de lectura posterior: no declarar éxito si queda algún campo privado en people.
  for(const id of ids){
   const snap=await db.doc('people/'+id).get();
   if(!snap.exists)continue;
   const data=snap.data()||{};
   const leaked=PRIVATE_FIELDS.filter(k=>Object.prototype.hasOwnProperty.call(data,k));
   if(leaked.length)throw new Error('Quedan campos privados en people/'+id+': '+leaked.join(', '));
  }
  toast('Separación revisada en '+ids.length+' integrantes; se movieron datos privados en '+moved+'. Antes de habilitar Scouts, verifica también en Firestore.');
 }catch(e){
  console.error('No se pudo verificar la separación de datos privados',e);
  toast('La separación NO quedó verificada. Mantén las reglas de Scouts cerradas y no publiques ETAPA 2.');
 }finally{legacyMigrationStarted=false;}
}
function listenCollection(name,cb){if(!db)return;const unsub=db.collection(name).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o);if(name==='people'&&me&&me.role==='scouter')migrateLegacyPrivateData();if(me)renderApp()},e=>{console.warn('Lectura bloqueada: '+name,e);if(me)toast('No se pudo cargar '+name+'. Revisa los permisos de Firestore.')});dataUnsubs.push(unsub)}
function startDataListeners(){

async function getPdfDownloads(){
 let dl=null;
 try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){}
 if(dl&&typeof dl.save==='function')return dl;
 return {save:async ({filename,data})=>{
  if(!(data instanceof Blob))throw new Error('El PDF generado no es válido.');
  const url=URL.createObjectURL(data),a=document.createElement('a');
  a.href=url;a.download=filename||'BELCHET.pdf';a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
 }};
}

async function submit(e){
 e.preventDefault();err('');
 const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 const role=mode==='new'?document.querySelector('input[name=r]:checked').value:null;
 if(!/^[a-z0-9._-]{3,30}$/.test(u))return err('Usa un usuario de 3 a 30 caracteres: letras sin acentos, números, punto, guion o guion bajo.');
 if(mode==='new'&&p.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
 if(!firebaseReady||!window.fbAuth||!window.fbStore)return err('Firebase no se pudo iniciar. Verifica la conexión a internet y vuelve a abrir este archivo.');
 const btn=$('#go');btn.disabled=true;
 try{
  if(mode==='new'){
   const credential=await window.fbAuth.createUserWithEmailAndPassword(usernameEmail(u),p);
   const profile={username:u,role:role,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
   if(role==='scouter')profile.codigoRegistro=$('#code').value;
   // Firestore Security Rules deben validar el código y el rol antes de aceptar este perfil.
   try{await window.fbStore.collection('users').doc(credential.user.uid).set(profile)}catch(profileError){try{await credential.user.delete()}catch(cleanupError){console.warn('No se pudo eliminar la cuenta de registro rechazado',cleanupError)}throw profileError}
   me={u,role,uid:credential.user.uid};
  }else{
   const credential=await window.fbAuth.signInWithEmailAndPassword(usernameEmail(u),p);
   const snap=await window.fbStore.collection('users').doc(credential.user.uid).get();
   if(!snap.exists){await window.fbAuth.signOut();return err('La cuenta no tiene perfil BELCHET. Contacta al administrador.');}
   const profile=snap.data();
   if(!['scout','scouter'].includes(profile.role)){await window.fbAuth.signOut();return err('El perfil tiene un rol no válido. Contacta al administrador.');}
   me={u,role:profile.role,uid:credential.user.uid};
  }
  await setup();$('#p').value='';$('#code').value='';show();
 }catch(x){
  console.error('Error de autenticación o perfil',x);
  const code=x&&x.code;
  if(code==='auth/email-already-in-use')err('Ese usuario ya existe. Selecciona Entrar.');
  else if(code==='auth/invalid-credential'||code==='auth/user-not-found'||code==='auth/wrong-password')err('Usuario o contraseña incorrectos.');
  else if(code==='auth/weak-password')err('La contraseña debe tener al menos 6 caracteres.');

 }finally{btn.disabled=false}
}
